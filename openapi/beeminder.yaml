  /charges:
    post:
      operationId: createCharge
      tags: [charges]
      summary: Create a charge
      description: |
        Create a charge of a given amount (US dollars, minimum 1.00) and optionally add a note. The user is inferred from the `access_token` or `auth_token`.
        This endpoint charges real money. Passing `dryrun` is documented to skip the charge, but this has not been measured, so do not rely on it to prevent a charge. See the `dryrun` parameter below.

        Path: the reference's HTTP Request line says `POST /charges` while its curl example posts to `/charges.json`. Measured unauthenticated on 2026-11-20, both paths exist (each returns 401, while an unknown path returns 404), so `/charges.json` also routes.
      x-charges-money: true
      x-unverified: true
      x-unverified-note: JSON body not measured; the reference shows form-encoded examples. Not measured at all, because a real charge bills money.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, amount]
              properties:
                user_id:
                  type: string
                  description: Username of the user who is getting charged.
                amount:
                  type: number
                  minimum: 1
                  description: The amount to charge the user, in US dollars. Minimum value is 1.00.
                note:
                  type: string
                  description: An explanation of why the charge was made.
                  x-unverified: true
                  x-unverified-note: Listed as a plain (not bracketed/optional) parameter, yet the text says "optionally add a note". Treated as optional.
                dryrun:
                  type: string
                  description: If passed, the Charge is not actually created, but its JSON is returned as if it were. Default false. The reference types this parameter as a string (unlike goal creation's `dryrun`, which it types as a boolean). WARNING - this was never measured; a client must not rely on `dryrun` to avoid charging real money until it has been measured (which values count as "passed", and whether a JSON body honors it, are unknown).
                  x-unverified: true
                  x-unverified-note: Never measured, since a wrong guess charges real money. The reference gives only the type (string) and the wording "If passed".
      responses:
        '200':
          description: The Charge object. If the request was not successful, an object with the error message(s) instead.
          x-unverified: true
          x-unverified-note: The reference does not say whether a failed charge returns 200 or an error status, so the 200 body may be either shape. Check for `errors` before reading it as a Charge.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Charge'
                    not:
                      required: [errors]
                      properties:
                        errors: {}
                  - $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
components:
  securitySchemes:
    authToken:
      type: apiKey
      in: query
      name: auth_token
      description: |
        Personal authentication token, for API calls to your own account. Get it by logging in and visiting https://www.beeminder.com/api/v1/auth_token.json.
        The reference says to append it as an additional GET or POST parameter. Measured 2026-11-20: for POST/PUT it can also be sent as `auth_token` in the JSON request body with no query parameter (200), which keeps the token out of URLs and logs. A body parameter cannot be expressed as a security scheme, so this scheme declares only the query form.
        Measured 2026-11-20: the personal token is not accepted as `Authorization: Bearer <auth_token>` (401); the Bearer scheme is for OAuth access tokens only.
        Do not name this parameter `access_token`.
    accessTokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: OAuth access token (see Client OAuth), sent as a query parameter. May also be sent as a POST parameter.
    accessTokenBearer:
      type: http
      scheme: bearer
      description: 'OAuth access token only (a personal `auth_token` sent this way returns 401, measured 2026-11-20), sent as `Authorization: Bearer <token>`. Obtain it by sending the user to https://www.beeminder.com/apps/authorize with `client_id`, `redirect_uri` and `response_type=token`; the token is returned in the redirect query string as `access_token` (plus `username`).'
  parameters:
    Username:
      name: username
      in: path
      required: true
      description: Beeminder username. May be the literal `me`, which expands to the username of the authorized user. The reference documents this in the Client OAuth section ("use `me` in place of the username for any endpoint", e.g. `/users/me.json` with an `access_token`); it does not say whether `me` also works with a personal `auth_token`.
      schema:
        type: string
    GoalSlug:
      name: slug
      in: path
      required: true
      description: The goal's slug, the final part of its URL (beeminder.com/username/slug).
      schema:
        type: string
    DatapointId:
      name: id
      in: path
      required: true
      description: Datapoint ID.
      schema:
        type: string
    Emaciated:
      name: emaciated
      in: query
      required: false
      description: If included, the goal attributes `road`, `roadall` and `fullroad` are stripped from the returned goal objects. The reference words this as presence-based ("If included"), so send `emaciated=true` or omit it; do not send `emaciated=false`.
      schema:
        type: boolean
      x-unverified: true
      x-unverified-note: The reference says "If included" (presence-based) but also gives "Default false"; it does not state whether an explicit `false` is honored. No `default` is declared so generated clients omit the parameter instead of sending `false`.
  responses:
    Unauthorized:
      description: Authentication failed. Measured unauthenticated on 2026-11-20 (GET /users/me.json without a token, and GET of an unknown user without a token, both returned 401 with this body shape).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            errors:
              message: Token missing or incorrect token.
              token: '...'
    UnprocessableEntity:
      description: Validation failure on goal update (measured 2026-11-20 with a non-alphanumeric tag). `errors` maps the field name to a list of messages.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation-tags:
              summary: Non-alphanumeric tag
              value:
                errors:
                  tags:
                    - must each be alphanumeric
    ApiErrorResponse:
      description: Error. The reference documents the body shape only by example, and does not document HTTP status codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      description: |
        Error body. `errors` is a string in the reference's examples (`{"errors": "Can't uncle a goal that's not in the red."}`; measured also: `{"errors": "Duplicate request"}`) or an object. Measured object shapes (2026-11-20): a 401 has string values (`message` and `token`), and a validation failure maps a field name to a list of messages (`{"value": ["is not a number"]}`).
      x-unverified: true
      x-unverified-note: The reference only shows string-valued `errors`; the object form comes from live measurements (401 and 422, 2026-11-20). HTTP status codes for errors other than the measured 401 and 422 are not documented.
      required:
        - errors
      properties:
        errors:
          description: Error message(s), as a string or as an object.
          oneOf:
            - type: string
            - type: object
              description: Values are strings (401 body) or arrays of strings (field to messages, validation failures).
              additionalProperties:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
    GoalResult:
      description: A Goal, or an `errors` body. A body that has `errors` only matches ApiError.
      anyOf:
        - $ref: '#/components/schemas/Goal'
          not:
            required: [errors]
            properties:
              errors: {}
        - $ref: '#/components/schemas/ApiError'
    GoalType:
      type: string
      description: |
        Shorthand for a collection of more fundamental goal settings. Changing the type of an existing goal does not change those settings.
        `hustler` Do More; `biker` Odometer; `fatloser` Weight loss; `gainer` Gain Weight; `inboxer` Inbox Fewer; `drinker` Do Less; `custom` Full access to the underlying goal parameters.
      enum: [hustler, biker, fatloser, gainer, inboxer, drinker, custom]
    User:
      type: object
      description: '`required` lists the attribute that appears in every User example in the reference; the reference does not explicitly state which attributes are always returned.'
      required: [username]
      properties:
        username:
          type: string
        timezone:
          type: string
        updated_at:
          type: number
          description: Unix timestamp (seconds) of the last update to this user or any of their goals or datapoints.
        goals:
          description: A list of slugs for each of the user's goals, or an array of goal objects if `diff_since` or `associations` is sent.
          # anyOf, not oneOf: an empty list matches both branches and must stay valid.
          anyOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: '#/components/schemas/Goal'
        deadbeat:
          type: boolean
          description: True if the user's payment info is out of date, or an attempted payment has failed.
        urgency_load:
          type: number
          description: A single number capturing how edge-skatey you are across all goals. Lower means fewer urgently due goals; 0 means at least 7 days of buffer on all active goals.
        deleted_goals:
          type: array
          description: Only returned if `diff_since` is sent. Each item has one key/value pair for the id of the deleted goal.
          items:
            type: object
            description: 'A hash with one key/value pair, the id of the deleted goal (the reference''s example is `{"id": "519279fd86f33468ne"}`).'
            required: [id]
            properties:
              id:
                type: string
    Goal:
      type: object
      description: |
        Everything about a specific goal. One of `goaldate`, `goalval` and `rate` is null, meaning it is calculated from the other two.
        Many attributes (including `mathishard`, `lane`, `delta`, `limsum`, `safebump`, `safebuf`, `initday`, `initval`, `curday`, `curval`, `currate`, `fullroad`, `headsum`, `graphsum`, `rah`, "and others") may be null if the goal is in an error state such that the graph cannot be generated, or if the goal is frozen. The reference does not list the "others", so only the named attributes are marked nullable.
        `required` lists the one attribute (`slug`) that appears in every Goal example in the reference, including the `skinny` subset; the reference does not explicitly state which attributes are always returned.
      required: [slug]
      properties:
        slug:
          type: string
          description: The final part of the goal's URL, used as an identifier.
        updated_at:
          type: number
          description: Unix timestamp of the last time this goal was updated.
        title:
          type: string
          description: The title the user specified for the goal.
        fineprint:
          type: string
          description: The user-provided description of what exactly they are committing to.
        yaxis:
          type: string
          description: The label for the y-axis of the graph.
        goaldate:
          type: [number, 'null']
          description: Unix timestamp (seconds) of the goal date. May be null (calculated from the other two of goaldate/goalval/rate).
        goalval:
          type: [number, 'null']
          description: Goal value, the number the bright red line will eventually reach. May be null.
        rate:
          type: [number, 'null']
          description: Slope of the (final section of the) bright red line; see `runits`. May be null.
        runits:
          type: string
          description: Rate units; the rate is yearly, monthly, weekly, daily or hourly.
          enum: [y, m, w, d, h]
        svg_url:
          type: string
          description: URL for the goal's graph SVG.
        graph_url:
          type: string
          description: URL for the goal's graph image.
        thumb_url:
          type: string
          description: URL for the goal's graph thumbnail image.
        autodata:
          type: [string, 'null']
          description: Name of the automatic data source, if any. Null for manual goals.
        goal_type:
          $ref: '#/components/schemas/GoalType'
        losedate:
          type: number
          description: Unix timestamp of derailment; when you cross the bright red line if nothing is reported.
        urgencykey:
          type: string
          description: Sort by this key (case-sensitive ASCII/Unicode ordering) to put goals in order of decreasing urgency.
        queued:
          type: boolean
          description: Whether the graph is currently being updated to reflect new data.
        secret:
          type: boolean
          description: Whether you have to be logged in as owner of the goal to view it. Default false.
        datapublic:
          type: boolean
          description: Whether you have to be logged in as the owner to view the datapoints. Default false.
        datapoints:
          type: array
          description: The datapoints for this goal.
          items:
            $ref: '#/components/schemas/Datapoint'
        numpts:
          type: number
          description: Number of datapoints.
        pledge:
          type: number
          description: Amount pledged (USD) on the goal.
        initday:
          type: [number, 'null']
          description: Unix timestamp (seconds) of the start of the bright red line.
        initval:
          type: [number, 'null']
          description: The y-value of the start of the bright red line.
        curday:
          type: [number, 'null']
          description: Unix timestamp (seconds) of the end of the bright red line, i.e. the most recent (inferred) datapoint.
        curval:
          type: [number, 'null']
          description: The value of the most recent datapoint.
        currate:
          type: [number, 'null']
          description: The rate of the red line at time `curday`. If there is a rate change on that day the value may be the limit from the right, but the reference says not to count on this.
        lastday:
          type: number
          description: Unix timestamp (seconds) of the last (explicitly entered) datapoint.
        yaw:
          type: number
          description: Good side of the bright red line (+1/-1 = above/below).
        dir:
          type: number
          description: Direction the bright red line is sloping, usually the same as `yaw`.
        lane:
          type: [number, 'null']
          deprecated: true
          description: Deprecated. See `losedate` and `safebuf`.
        mathishard:
          type: [array, 'null']
          description: The goaldate, goalval and rate, all filled in. May be null if the goal is in an error state.
          items:
            type: number
          minItems: 3
          maxItems: 3
        headsum:
          type: [string, 'null']
          deprecated: true
          description: Deprecated. Summary text blurb saying how much safety buffer you have.
        limsum:
          type: [string, 'null']
          description: Summary of what you need to do to eke by, e.g. "+2 within 1 day".
        kyoom:
          type: boolean
          description: Cumulative; plot values as the sum of all those entered so far (auto-summing).
        odom:
          type: boolean
          description: Treat zeros as accidental odometer resets.
        edgy:
          type: boolean
          x-unverified: true
          x-unverified-note: Appears only in the goal-type defaults table, not in the Goal attribute list.
        aggday:
          type: string
          description: How to aggregate points on the same day, e.g. min/max/mean. The goal-type table shows "sum", "last", "min" and "max".
        steppy:
          type: boolean
          description: Join dots with purple steppy-style line.
        rosy:
          type: boolean
          description: Show the rose-colored dots and connecting line.
        movingav:
          type: boolean
          description: Show moving average line superimposed on the data.
        aura:
          type: boolean
          description: Show turquoise swath, aka blue-green aura.
        frozen:
          type: boolean
          description: Whether the goal is currently frozen and must be restarted before continuing to accept data.
        won:
          type: boolean
          description: Whether the goal has been successfully completed.
        lost:
          type: boolean
          description: Whether the goal is currently off track.
        maxflux:
          type: integer
          description: Max daily fluctuation for weight goals. Used as an absolute buffer amount after a derail; also shown on the graph as a thick guiding line.
        contract:
          type: object
          description: The contract on the goal.
          properties:
            amount:
              type: number
              description: Amount at risk on the contract.
            stepdown_at:
              type: [number, 'null']
              description: Unix timestamp of when the contract is scheduled to revert to the next lowest pledge amount. Null means not scheduled to revert.
        road:
          type: array
          description: Array of tuples used to construct the bright red line (graph matrix). Each tuple specifies 2 of 3 of [time, goal, rate]; start from a known (time, value) and fill the missing one forward. Rows are 3-element [time, goal, rate] tuples with one null (the reference defines `roadall` as "like `road`" with extra first and last rows of that form).
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: [number, 'null']
        roadall:
          type: array
          description: Like `road` but with an additional initial row [initday, initval, null] and a final row [goaldate, goalval, rate], one of which is also null. Rows are 3-element tuples (per the reference).
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: [number, 'null']
        fullroad:
          type: [array, 'null']
          description: Like `roadall` but with the nulls filled in, so rows are 3-element tuples with no nulls (per the reference). The whole attribute may be null if the goal is in an error state.
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
        rah:
          type: [number, 'null']
          description: Red line value (y-value of the bright red line) at the akrasia horizon (today plus one week).
        delta:
          type: [number, 'null']
          description: Distance from the bright red line to today's datapoint (`curval`).
        delta_text:
          type: string
          deprecated: true
          description: Deprecated.
        safebuf:
          type: [integer, 'null']
          description: The integer number of safe days. Zero if it is a beemergency.
        colorkey:
          type: string
          description: One of red, orange, blue, green, dkgreen, gray, indicating the amount of safety buffer (gray when an error prevents generating the graph).
          x-unverified: true
          x-unverified-note: The attribute text says `dkgreen` but the sample JavaScript in the same section returns "darkgreen"; kept as a plain string.
        colorhex:
          type: string
          description: The RGB color corresponding to `colorkey`.
        safebump:
          type: [number, 'null']
          description: The absolute y-axis number you need to reach to get one additional day of safety buffer.
        autoratchet:
          type: [number, 'null']
          description: The goal's autoratchet setting (read-only); the maximum number of days of safety buffer the goal may accrue (for Do-Less goals, the max buffer in goal units). Null if not set or no permission to autoratchet.
        id:
          type: string
          description: Hex-digit goal id. Useful because slugs can be changed.
        callback_url:
          type: string
          description: Callback URL. If different apps change this they step on each other's toes.
        description:
          type: string
          deprecated: true
          description: Deprecated. User-supplied description of goal (the "Goal Statement" in the graph page sidebar).
        graphsum:
          type: [string, 'null']
          deprecated: true
          description: Deprecated. Text summary of the graph, no longer used in the web UI.
        lanewidth:
          type: number
          deprecated: true
          description: Deprecated. Now always zero.
        deadline:
          type: number
          description: Seconds by which your deadline differs from midnight (negative is before, positive after). Allowed range is -17*3600 to 6*3600 (7am to 6am).
        leadtime:
          type: number
          description: Days before derailing we start sending reminders. Zero means start on the beemergency day.
        alertstart:
          type: number
          description: Seconds after midnight that reminders start (on the day you are scheduled to start getting them).
        plotall:
          type: boolean
          description: Whether to plot all the datapoints, or only the `aggday`'d one.
        last_datapoint:
          $ref: '#/components/schemas/Datapoint'
        integery:
          type: boolean
          description: Assume that the units must be integer values (used for things like `limsum`).
        gunits:
          type: string
          description: Goal units, like "hours" or "pushups" or "pages".
        timey:
          type: boolean
          description: Whether to show data in a "timey" way, with colons (1.5 shows as 1:30). Replaces `hhmmformat`.
        hhmmformat:
          type: boolean
          deprecated: true
          description: Deprecated; will be removed. Use `timey`.
        todayta:
          type: boolean
          description: Whether there are any datapoints for today.
        weekends_off:
          type: boolean
          description: If the goal has weekends automatically scheduled.
        tmin:
          type: string
          description: 'Lower bound on x-axis, yyyy-mm-dd (X-min in Graph Settings).'
        tmax:
          type: string
          description: 'Upper bound on x-axis, yyyy-mm-dd (X-max in Graph Settings).'
        tags:
          type: array
          description: A list of the goal's tags.
          items:
            type: string
        archivedate:
          type: [number, 'null']
          description: Unix timestamp (seconds) at which the goal will be archived. Null if already archived or not scheduled for archive. May be in the past if archival is due or in flight.
    Datapoint:
      type: object
      description: '`required` lists the attributes that appear in every Datapoint example in the reference; the reference does not explicitly state which attributes are always returned.'
      required: [id, timestamp, value]
      properties:
        id:
          type: string
          description: A unique ID, used to identify a datapoint when deleting or editing it.
        timestamp:
          type: number
          description: Unix time (seconds) of the datapoint.
        daystamp:
          type: string
          description: 'The date of the datapoint, e.g. "20150831". Prefer this over timestamp, which can be surprising due to goal deadlines.'
        value:
          type: number
          description: The value, e.g. how much you weighed on the day indicated by the timestamp.
        comment:
          type: string
          description: An optional comment about the datapoint.
        updated_at:
          type: number
          description: Unix time that this datapoint was entered or last updated.
        requestid:
          type: string
          description: If the datapoint was created via the API with this parameter, it is echoed back.
        origin:
          type: string
          description: Short code for where the datapoint came from, e.g. "web", or "duolingo" for an autodata integration.
        creator:
          type: [string, 'null']
          description: Like `origin` but for users; for group goals, the member who added the data. Null when there is no logical creator.
        is_dummy:
          type: boolean
          description: Not a logical datapoint, e.g. a "#DERAIL" datapoint or a Pessimistic Presumptive datapoint added by Beeminder.
        is_initial:
          type: boolean
          description: The initial datapoint added at goal creation. Meaningful data for Odometer goals, more of a placeholder for Do More goals.
        created_at:
          type: [string, number]
          description: The timestamp at which the datapoint was created, which may differ from `timestamp`.
          x-unverified: true
          x-unverified-note: The reference gives the type as "time" without saying whether it is a Unix number or a formatted string.
        status:
          type: string
          description: Observed in live responses 2026-11-20, not in the reference (e.g. "created").
        urtext:
