openapi: 3.1.0
info:
  title: Beeminder API
  version: v1
  description: |
    Beeminder API v1, written from the official API reference (Slate markdown) plus live measurements against a test account on 2026-11-20 (writes reverted). Where a description says "measured", it comes from those requests, not from the reference.

    Conventions taken from the reference:
    - Every endpoint requires authentication (see `securitySchemes`).
    - `username` may be the literal `me`, which is expanded to the authorized user.
    - Use exactly the base URL below. Beeminder redirects `http` and non-`www` requests but does not forward parameters for POST requests.
    - Timestamps are Unix time in seconds.

    `x-unverified: true` marks anything that neither the reference nor a measurement settles (ambiguous or inconsistent reference text, unmeasured request bodies, unknown status codes); each carries an `x-unverified-note` saying why.
  x-source: Beeminder API Reference (beeminder/apidocs, source/index.html.md) at commit 21e92e36bc15add4bcbe2944842215ab24e9aa0a, committed 2026-09-29 (git blob 8af20e66b6663ef1deefabb9493e145c64b0f30d, identical to the file this spec was written from)
servers:
  - url: https://www.beeminder.com/api/v1
    description: Canonical base URL. Do not use http:// or a non-www host; POST parameters are lost on redirect.
tags:
  - name: users
    description: User resource.
  - name: goals
    description: Goal resource and goal actions.
  - name: datapoints
    description: Datapoint resource.
  - name: charges
    description: Charge resource. Creating charges bills real money.
security:
  - authToken: []
  - accessTokenQuery: []
  - accessTokenBearer: []
paths:
  /users/{username}.json:
    get:
      operationId: getUser
      tags: [users]
      summary: Get information about a user
      description: |
        Retrieves information and a list of goal slugs for the user with username `username`.
        Because an access token uniquely identifies a user, `me` may be used instead of the username.

        Use `updated_at` to avoid unnecessary requests: it changes whenever the user, any of their goals, or any datapoint changes. It has one-second granularity, so changes within the same second as a previous read share its value; an equal value does not prove nothing changed.

        The same path and method also serves "Authenticate and redirect the user": when `redirect_to_url` is given, Beeminder attempts to authenticate the user and, if successful, redirects to that URL.
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: associations
          in: query
          required: false
          description: Convenience method to fetch all information about a user. Send `true` to receive all of the user's goals and datapoints as attributes of the user object. Use sparingly; see also `diff_since`.
          schema:
            type: boolean
            default: false
        - name: diff_since
          in: query
          required: false
          description: Unix timestamp in seconds. Only goals and datapoints created or updated since the timestamp are returned. Implies `associations`. Default null returns all goals and datapoints. The reference gives `updated_at` (which this is compared against) in whole seconds, so updates within the same second share the same value; keep that in mind when syncing by `updated_at`.
          schema:
            type: integer
        - name: skinny
          in: query
          required: false
          description: Only get a subset of goal attributes and the most recent datapoint (as `last_datapoint`, replacing `datapoints`). Must be sent along with `diff_since`; ignored otherwise. The subset is `slug, title, description, goalval, rate, goaldate, svg_url, graph_url, thumb_url, goal_type, autodata, losedate, urgencykey, deadline, leadtime, alertstart, id, queued, updated_at, burner, yaw, lane, delta, runits, limsum, frozen, lost, won, contract, delta_text, safebump, gunits, todayta, timey, hhmmformat`.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Emaciated'
        - name: datapoints_count
          in: query
          required: false
          description: Only receive the `n` most recently added datapoints, sorted by `updated_at` (a datapoint with an old timestamp that was added recently sorts as recent). Default null returns all datapoints.
          schema:
            type: integer
            minimum: 0
        - name: redirect_to_url
          in: query
          required: false
          description: URL to redirect the user to after authenticating them. Lets third-party apps send the user to a part of the website without a login screen.
          schema:
            type: string
          x-unverified: true
          x-unverified-note: The reference says that on success the user is redirected to this URL instead of getting a User object, but gives neither the 3xx status code nor the response body, and does not say whether this can be combined with the other parameters. No redirect response is modelled because it breaks generated clients.
      responses:
        '200':
          description: A User object (normal case, without `redirect_to_url`). With `redirect_to_url` the server redirects instead (status code unknown, see the parameter).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals.json:
    get:
      operationId: listGoals
      tags: [goals]
      summary: Get all goals for a user
      description: Get the user's list of goals, sorted in descending order of urgency (increasing order of time to derailment).
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Emaciated'
      responses:
        '200':
          description: A list of Goal objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal for a user
      description: |
        Create a new goal for the user. Rule: exactly two out of three of `goaldate`, `goalval` and `rate` are required (the reference's example sends the unused one as `null`); sending fewer or more than two is invalid.

        If you pass your API client's registered name as `datasource` and your client has a registered `autofetch_callback_url`, Beeminder POSTs to your callback when the goal wants new data.
      x-unverified: true
      x-unverified-note: JSON body not measured; the reference shows form-encoded examples.
      parameters:
        - $ref: '#/components/parameters/Username'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title, goal_type, gunits]
              properties:
                slug:
                  type: string
                  description: The final part of the goal URL, used as an identifier.
                title:
                  type: string
                goal_type:
                  $ref: '#/components/schemas/GoalType'
                gunits:
                  type: string
                  description: Goal units, like "hours" or "pushups" or "pages".
                goaldate:
                  type: [number, 'null']
                  description: Unix timestamp (seconds) of the goal date. Exactly two of `goaldate`, `goalval`, `rate` must be non-null.
                goalval:
                  type: [number, 'null']
                  description: Goal value. Exactly two of `goaldate`, `goalval`, `rate` must be non-null.
                rate:
                  type: [number, 'null']
                  description: Slope of the bright red line (with `runits`). Exactly two of `goaldate`, `goalval`, `rate` must be non-null.
                initval:
                  type: number
                  default: 0
                  description: Initial value for today's date.
                secret:
                  type: boolean
                datapublic:
                  type: boolean
                datasource:
                  type: string
                  description: 'One of "api", "ifttt", "zapier", or a registered client name. Default: none (manual).'
                dryrun:
                  type: boolean
                  default: false
                  description: Pass this to test the endpoint without actually creating a goal.
                tags:
                  type: array
                  description: Optional list of tags to add to the new goal. Each tag must be an alphanumeric string.
                  items:
                    type: string
                    pattern: '^[A-Za-z0-9]+$'
                  x-unverified: true
                  x-unverified-note: A JSON tags array was measured only on goal update (PUT), not on create; the reference does not say how an array is sent.
      responses:
        '200':
          description: The newly created Goal object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation failure. Inferred from the goal update endpoint (measured there); not measured on create.
          x-unverified: true
          x-unverified-note: The 422 status and body were measured on goal update, not on goal create.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation-tags:
                  summary: Non-alphanumeric tag (measured on goal update)
                  value:
                    errors:
                      tags:
                        - must each be alphanumeric
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/archived.json:
    get:
      operationId: listArchivedGoals
      tags: [goals]
      summary: Get archived goals for a user
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Emaciated'
      responses:
        '200':
          description: A list of Goal objects representing the user's archived goals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}.json:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get information about a goal
      description: Gets goal details for the user's goal `slug` (beeminder.com/username/slug).
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
        - name: datapoints
          in: query
          required: false
          description: Whether to send the goal's datapoints in the response.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Emaciated'
      responses:
        '200':
          description: A Goal object, possibly without the `datapoints` attribute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal for a user
      description: |
        Update the user's goal with slug `slug`. Similar to goal creation, but `goal_type` cannot be changed.
        JSON body measured 2026-11-20 with `tags` and `title` only; the other fields are assumed to parse the same way.
        To change any of `goaldate`, `goalval`, `rate`, use `roadall`.
        The `roadall` note about changing rate units in the same call implies `runits` can be sent here, but the reference does not list `runits` as a parameter of this endpoint (or of goal creation), so it is not modelled.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                yaxis:
                  type: string
                  description: Label for the y-axis of the graph.
                tmin:
                  type: string
                  description: 'Lower bound on x-axis, date format "yyyy-mm-dd" (X-min in Graph Settings).'
                tmax:
                  type: string
                  description: 'Upper bound on x-axis, date format "yyyy-mm-dd" (X-max in Graph Settings).'
                secret:
                  type: boolean
                datapublic:
                  type: boolean
                roadall:
                  type: array
                  description: |
                    Array of rows like `[date::int, value::float, rate::float]`, each with exactly one field null.
                    - Must not make the goal easier between now and the akrasia horizon (unless you are an admin).
                    - Use `roadall` returned by the goal GET, not `road` (the latter is missing the first and last rows).
                    - The first row must be `[date, value, null]` and gives the start of the bright red line (same as `initday` and `initval`).
                    - The last row can be `[null, value, rate]` but no other row can be.
                    - Dates may also be given as a daystamp or date string, e.g. "20170727" or "2017-07-27".
                    - A superset of `dial_road`, which changes just the last row.
                    - If rate units change in the same call, the bright red line is updated first and rate units second; express adjustments in the original rate units, or make two calls.
                  items:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items:
                      type: [number, string, 'null']
                  x-unverified: true
                  x-unverified-note: Sent as a real JSON array of arrays. Not measured against the live API (only `tags` and `datapoints` bodies were), including whether JSON null cells are accepted in rows. Row element types are number, null, or (for dates) a daystamp/date string per the reference.
                datasource:
                  type: string
                  description: 'One of "api", "ifttt", "zapier", or a registered client name. Pass the empty string to unset the datasource (return to manual entry). If the registered client name has an `autofetch_callback_url`, Beeminder POSTs to it when the goal wants new data.'
                tags:
                  type: [array, 'null']
                  description: List of tags for the goal. Each tag must be alphanumeric (a non-alphanumeric tag returns 422). Replaces the existing tags; an empty array or explicit null removes all tags. Measured 2026-11-20 with a JSON body, a tag array sets the tags and `[]` clears them; explicit null is documented but was not measured.
                  items:
                    type: string
                    pattern: '^[A-Za-z0-9]+$'
      responses:
        '200':
          description: The updated Goal object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/refresh_graph.json:
    get:
      operationId: refreshGoalGraph
      tags: [goals]
      summary: Force a fetch of autodata and graph refresh
      description: |
        Analogous to the refresh button on the goal page. Forces a refetch of autodata for goals with automatic data sources and refreshes the graph image regardless.
        Be extremely conservative with this endpoint.
        This is asynchronous: it returns `true` if the goal was queued and `false` if not. Watch for an updated graph image.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      responses:
        '200':
          description: '`true` if the goal was queued, `false` if not.'
          content:
            application/json:
              schema:
                type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/dial_road.json:
    post:
      operationId: dialRoad
      tags: [goals]
      deprecated: true
      summary: Update a yellow brick road aka bright red line
      description: |
        Deprecated in favor of `roadall` on goal update.
        Changes the slope of the bright red line, starting after the one-week akrasia horizon.
        Rule: exactly two of `goaldate`, `goalval` and `rate` should be specified; setting two implies the third (the reference's example sends the unused one as `null`).
      x-unverified: true
      x-unverified-note: JSON body not measured; the reference shows form-encoded examples.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rate:
                  type: [number, 'null']
                goaldate:
                  type: [number, 'null']
                goalval:
                  type: [number, 'null']
      responses:
        '200':
          description: The updated Goal object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/shortcircuit.json:
    post:
      operationId: shortCircuitGoal
      tags: [goals]
      summary: Short circuit a goal's pledge
      description: Increases the goal's pledge level and charges the user the amount of the current pledge. This endpoint charges real money.
      x-charges-money: true
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      responses:
        '200':
          description: The updated Goal object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/stepdown.json:
    post:
      operationId: stepDownGoal
      tags: [goals]
      summary: Step down a goal's pledge
      description: Decreases the goal's pledge level subject to the akrasia horizon, i.e. not immediately. After a successful request the goal has a countdown (`contract.stepdown_at`) to when it reverts to the lower pledge level.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      responses:
        '200':
          description: The updated Goal object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/cancel_stepdown.json:
    post:
      operationId: cancelStepDownGoal
      tags: [goals]
      summary: Cancel a scheduled step down
      description: Cancels a pending stepdown of a goal's pledge. The pledge remains at the current amount.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      responses:
        '200':
          description: The updated Goal object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/uncleme.json:
    post:
      operationId: uncleGoal
      tags: [goals]
      summary: Call "Uncle" (instant derail)
      description: |
        Use at your own risk. Instantly derails a goal that is imminently going to derail (in a beemergency, i.e. "in the red"): stops all alerts, charges the pledge amount, and inserts the post-derail respite into the graph.
        Fails if the goal has more than 0 days of buffer.
        This endpoint charges real money: it charges the user and all Groupies of the goal immediately. There are no takebacks, no undos and no refunds.
      x-charges-money: true
      x-unverified: true
      x-unverified-note: The reference's curl example has neither `-X POST` nor any `-d` data, so as written it would be a GET, while the HTTP Request line says POST. POST is used here per the HTTP Request line.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      responses:
        '200':
          description: The updated Goal object, or an `errors` body if the goal is not red (see ApiError; the reference's example error is "Can't uncle a goal that's not in the red.").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/ratchet.json:
    post:
      operationId: ratchetGoal
      tags: [goals]
      summary: Ratchet a goal
      description: |
        Ratchets down the goal by reducing the safety buffer (do-more goals) or hard cap (do-less goals), moving the bright red line closer to current data and making the goal harder.

        - Do More / Odometer / Gain Weight goals: `newsafety` is the number of days of safety buffer to ratchet down to.
        - Do Less / Whittle Down goals: `newsafety` is the number of units of buffer (distance, in the goal's units, between the current total and the bright red line). It is relative to the bright red line, not the absolute hard-cap total.

        If the goal is on a flat spot (e.g. a scheduled break starting tomorrow), `newsafety` is clamped to a minimum of 1 day; the request still returns 200 but the resulting buffer may be larger than requested.

        Rule: when `newsafety` is 0, `beemergency` must also be sent as `true`, otherwise the request fails with an error.

        Documented error messages (returned in the `errors` field): "newsafety parameter is required", "newsafety must be a number", "newsafety cannot be negative", "newsafety cannot exceed X", "Ratcheting to 0 days of buffer requires beemergency=True on the API call", "Goal cannot be ratcheted because it is non-monotonic in the next N days", "Goal cannot be ratcheted (may be archived, ended, or have no buffer)", "Failed to ratchet goal".
      x-unverified: true
      x-unverified-note: JSON body not measured; the reference shows form-encoded examples.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newsafety]
              properties:
                newsafety:
                  type: number
                  minimum: 0
                  description: Target safety buffer to ratchet down to (days for do-more goals, units for do-less goals). Must be between 0 and the current maximum ratchetable amount.
                beemergency:
                  type: boolean
                  description: Required (as `true`) when `newsafety=0`. The reference also documents the strings "true" and "True" as accepted; the JSON boolean is modelled here. Safety mechanism against accidentally ratcheting to a beemergency.
                  x-unverified: true
                  x-unverified-note: A JSON boolean was not measured; the reference's example sends the string "True" in a form body.
      responses:
        '200':
          description: The updated Goal object. The reference's example errors for this endpoint are `errors` bodies (see ApiError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/datapoints.json:
    get:
      operationId: listDatapoints
      tags: [datapoints]
      summary: Get all the datapoints
      description: Get the list of datapoints for the user's goal (beeminder.com/username/slug).
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
        - name: sort
          in: query
          required: false
          description: Which attribute to sort on, descending. Defaults to `id` if none given.
          schema:
            type: string
            default: id
        - name: count
          in: query
          required: false
          description: Limit results to this number of datapoints. Must be non-negative. Defaults to all datapoints. Ignored when `page` is specified.
          schema:
            type: integer
            minimum: 0
        - name: page
          in: query
          required: false
          description: Used to paginate results; 1-indexed (page 1 is the first page).
          schema:
            type: integer
            minimum: 1
        - name: per
          in: query
          required: false
          description: Number of results per page. Ignored without `page`. Must be non-negative.
          schema:
            type: integer
            minimum: 0
            default: 25
      responses:
        '200':
          description: The list of Datapoint objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Datapoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
    post:
      operationId: createDatapoint
      tags: [datapoints]
      summary: Create a datapoint
      description: |
        Add a new datapoint to the user's goal.
        This is an upsert and `requestid` is an idempotency key: if a datapoint with the same `requestid` exists and is identical, the request is ignored (the reference says the API returns "duplicate datapoint"; measured 2026-11-20, that is HTTP 422 with `{"errors": "Duplicate request"}`); if it differs, the datapoint is updated; otherwise it is created.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatapointInput'
      responses:
        '200':
          description: The created or updated Datapoint object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datapoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation failure, e.g. duplicate requestid or non-numeric value (both measured 2026-11-20).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                duplicate:
                  summary: Same `requestid` sent again
                  value:
                    errors: Duplicate request
                validation-value:
                  summary: Non-numeric `value`
                  value:
                    errors:
                      value:
                        - is not a number
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /users/{username}/goals/{slug}/datapoints/create_all.json:
    post:
      operationId: createDatapoints
      tags: [datapoints]
      summary: Create multiple datapoints
      description: Create multiple new datapoints for the user's goal. Each datapoint must include at minimum a `value`; other parameters are the same as for single create.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/GoalSlug'
      requestBody:
        required: true
        content:
